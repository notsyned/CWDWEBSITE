media:
  input: images/uploads
  output: /images/uploads

content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    fields:
      - name: items
        label: News items
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: date
            label: Date
            type: date
          - name: image
            label: Photo
            type: image
          - name: body
            label: Text
            type: text