media:
  - name: images
    label: Images
    input: images/uploads
    output: images/uploads
  - name: documents
    label: Documents
    input: documents
    output: documents

content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    fields:
      - name: items
        label: News items
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: date
            label: Date
            type: date
          - name: image
            label: Photo
            type: image
            options:
              media: images
          - name: body
            label: Text
            type: text
          - name: attachments
            label: Attachments (optional)
            type: object
            list: true
            fields:
              - name: name
                label: Name shown to the public
                type: string
              - name: file
                label: File (PDF)
                type: file
                options:
                  media: documents

  - name: careers
    label: Careers
    type: file
    path: data/careers.json
    format: json
    fields:
      - name: items
        label: Job postings
        type: object
        list: true
        fields:
          - name: title
            label: Position title
            type: string
          - name: status
            label: Status
            type: select
            options:
              values: [Open, Closed]
          - name: deadline
            label: Application deadline
            type: date
          - name: description
            label: Description and requirements
            type: text
          - name: document
            label: Attached document (PDF)
            type: file
            options:
              media: documents

  - name: transparency
    label: Transparency Documents
    type: file
    path: data/transparency.json
    format: json
    fields:
      - name: items
        label: Documents
        type: object
        list: true
        fields:
          - name: title
            label: Document title
            type: string
          - name: category
            label: Category
            type: select
            options:
              values: [Annual Report, Financial Report, Procurement, Citizen's Charter, FOI, Other]
          - name: year
            label: Year
            type: string
          - name: document
            label: File (PDF)
            type: file
            options:
              media: documents

  - name: rates
    label: Rates and Fees
    type: file
    path: data/rates.json
    format: json
    fields:
      - name: verified
        label: Finance has verified the current rates?
        type: boolean
      - name: verification_note
        label: Rate publication note
        type: text
      - name: minimum_consumption
        label: Verified minimum consumption (cubic meters)
        type: number
      - name: minimum_charge
        label: Verified minimum charge (PHP)
        type: number
      - name: excess_rate
        label: Verified charge per additional cubic meter (PHP)
        type: number
      - name: tiers
        label: Water rate tiers
        type: object
        list: true
        fields:
          - name: label
            label: Label (example 11-20 cu.m.)
            type: string
          - name: rate
            label: Rate per cubic meter (PHP)
            type: number
      - name: fees
        label: Other fees
        type: object
        list: true
        fields:
          - name: name
            label: Fee name
            type: string
          - name: amount
            label: Amount (PHP)
            type: number
      - name: schedule_pdf
        label: Official rate schedule (PDF, optional)
        type: file
        options:
          media: documents

  - name: faq
    label: FAQ
    type: file
    path: data/faq.json
    format: json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text

  - name: homepage
    label: Homepage Banner
    type: file
    path: data/homepage.json
    format: json
    fields:
      - name: banner_show
        label: Show the banner?
        type: boolean
      - name: banner_label
        label: Banner type
        type: select
        options:
          values: [Notice, Advisory, Water Interruption]
      - name: banner_message
        label: Banner message
        type: text

  - name: services
    label: Other Services — Service Cards
    type: file
    path: data/services.json
    format: json
    fields:
      - name: items
        label: Public-facing service cards
        type: object
        list: true
        fields:
          - name: name
            label: Service name
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Service photo (optional)
            type: image
            options:
              media: images
          - name: image_alt
            label: Service photo description (optional)
            type: string
          - name: requirements
            label: Requirements (optional)
            type: text
          - name: attachments
            label: Downloadable forms (optional)
            type: object
            list: true
            fields:
              - name: name
                label: Name shown to the public
                type: string
              - name: file
                label: File (PDF)
                type: file
                options:
                  media: documents

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    fields:
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Project title
            type: string
          - name: status
            label: Status
            type: select
            options:
              values: [Planned, Ongoing, Completed]
          - name: location
            label: Location or barangay
            type: string
          - name: updated
            label: Last updated
            type: date
          - name: image
            label: Cover photo
            type: image
            options:
              media: images
          - name: gallery
            label: Additional project photos
            type: object
            list: true
            fields:
              - name: image
                label: Photo
                type: image
                options:
                  media: images
              - name: caption
                label: Caption
                type: string
          - name: description
            label: Description
            type: text
          - name: attachments
            label: Attachments (optional)
            type: object
            list: true
            fields:
              - name: name
                label: Name shown to the public
                type: string
              - name: file
                label: File (PDF)
                type: file
                options:
                  media: documents

