
  - name: about
    label: About Us (Board and Management)
    type: file
    path: data/about.json
    format: json
    fields:
      - name: board
        label: Board of Directors
        type: object
        list: true
        fields:
          - name: name
            label: Full name
            type: string
          - name: position
            label: Position (example Chairperson)
            type: string
          - name: photo
            label: Photo (optional)
            type: image
            options:
              media: images
      - name: management
        label: Management and Department Heads
        type: object
        list: true
        fields:
          - name: name
            label: Full name
            type: string
          - name: title
            label: Title
            type: string
          - name: office
            label: Office or department
            type: string
          - name: photo
            label: Photo (optional)
            type: image
            options:
              media: images